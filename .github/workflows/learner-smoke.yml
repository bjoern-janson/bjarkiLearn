name: Learner focused Lua regressions
on:
  push:
    paths:
      - '*.lua'
      - 'tests/**'
      - '.github/workflows/learner-smoke.yml'
  pull_request:
    paths:
      - '*.lua'
      - 'tests/**'
      - '.github/workflows/learner-smoke.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua runtimes
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 lua5.4
      - name: Inspect historical verification harness
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, collections
          p=pathlib.Path('releases/0.1.6-shadow/verification-r11/bjarkiLearn-0.1.6-shadow-verification-r11.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print('archive entries',len(names))
              print('root entries:')
              print('\n'.join(sorted({n.split('/')[0] for n in names})))
              print('potential harness names:')
              for n in names:
                  if n.endswith(('run_all.py','README-VERIFICATION.txt','test_core.py','test_native.py','requirements-test.txt')) or '/tests/' in n and n.endswith('.py') and n.count('/')<=2:
                      print(n)
          PY
      - name: Inspect inherited runtime test entrypoints
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          p='releases/0.1.6-shadow/verification-r11/bjarkiLearn-0.1.6-shadow-verification-r11.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              for prefix in ('source/','tests-016/','review-016/','smoke/','prior/tests/'):
                  selected=[n for n in names if n.startswith(prefix) and n.endswith(('.lua','.py','.md','.txt')) and n.count('/')<=3]
                  print('ENTRYPOINTS',prefix,len(selected))
                  print('\\n'.join(selected[:45]))
              for path in ('README-VERIFICATION.txt','tests-016/run_all.py','tests-016/run_repair.py','tests-016/repair.py'):
                  if path in names:
                      print('FILE',path)
                      print('\\n'.join(z.read(path).decode('utf-8').splitlines()[:110]))
          PY
      - name: Inspect verification runner arguments
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          p='releases/0.1.6-shadow/verification-r11/bjarkiLearn-0.1.6-shadow-verification-r11.zip'
          paths=('tests-016/run.py','review-016/run.py','smoke/run.py','prior/tests/run_retention.py','tests-016/harness.lua','review-016/README.txt','tests-016/REPORT.txt')
          with zipfile.ZipFile(p) as z:
              for path in paths:
                  print('====',path)
                  lines=z.read(path).decode('utf-8').splitlines()
                  limit=155 if path.endswith('run.py') else 75
                  for i,line in enumerate(lines[:limit],1): print(str(i).rjust(4),line)
          PY
      - name: Lua 5.1 source regression
        run: lua5.1 tests/test_017.lua
      - name: Lua 5.4 source regression
        run: lua5.4 tests/test_017.lua
      - name: Re-run inherited 0.1.6 runtime tests on 0.1.7 (diagnostic pass)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q lupa
          python3 - <<'PY'
          import zipfile
          p='releases/0.1.6-shadow/verification-r11/bjarkiLearn-0.1.6-shadow-verification-r11.zip'
          with zipfile.ZipFile(p) as z: z.extractall('_legacy017')
          PY
          mkdir -p inherited-017-reports
          set +e
          python3 _legacy017/tests-016/run.py --source . --baseline _legacy017/baseline/source/bjarkiLearn --output inherited-017-reports/semantic.json > inherited-017-reports/semantic.log 2>&1
          echo "SEMANTIC_EXIT=$?"
          python3 _legacy017/review-016/run.py --source . --baseline _legacy017/baseline/source/bjarkiLearn --output inherited-017-reports/review.json > inherited-017-reports/review.log 2>&1
          echo "REVIEW_EXIT=$?"
          python3 _legacy017/smoke/run.py --source . --output inherited-017-reports/smoke.json > inherited-017-reports/smoke.log 2>&1
          echo "SMOKE_EXIT=$?"
          set -e
          python3 - <<'PY'
          import json,pathlib
          for name in ('semantic','review','smoke'):
              path=pathlib.Path('inherited-017-reports')/(name+'.json')
              if not path.exists():
                  print(name,'NO REPORT'); print((path.parent/(name+'.log')).read_text()[-1800:]);continue
              j=json.loads(path.read_text())
              print('INHERITED',name,'PASS',j.get('passed',j.get('summary',{}).get('passed')),'TOTAL',j.get('total',j.get('summary',{}).get('total')))
              failures=[r for r in j.get('cases',[]) if r.get('passed') is False]
              for r in failures[:35]: print('FAIL',name,{k:str(v)[:250] for k,v in r.items() if k in ('engine','runtime','case','name','source','error','message')})
              print('FAIL_COUNT',name,len(failures))
          PY
      - name: Save inherited test reports
        uses: actions/upload-artifact@v4
        with:
          name: bjarkiLearn-0.1.7-inherited-runtime-diagnostics
          path: inherited-017-reports/
          if-no-files-found: error
      - name: Build and validate install ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = [
              'Bootstrap.lua', 'Rules.lua', 'Network.lua', 'Core.lua',
              'Adapter.lua', 'Main.lua', 'bjarkiLearn.toc',
              'bjarkiLearn_Camelot.toc', 'README.md', 'CHANGELOG.md',
              'DESIGN.md', 'VERIFICATION.md', 'docs/API.md',
              'docs/IMPLEMENTATION.md',
          ]
          output = 'bjarkiLearn-0.1.7-shadow.zip'
          with ZipFile(output, 'w', ZIP_DEFLATED, compresslevel=9) as archive:
              for path in paths:
                  archive.write(path, 'bjarkiLearn/' + path)
          with ZipFile(output) as archive:
              assert archive.testzip() is None
              assert sorted(archive.namelist()) == sorted('bjarkiLearn/' + p for p in paths)
              for path in paths:
                  assert archive.read('bjarkiLearn/' + path) == Path(path).read_bytes()
          print('Verified 14 exact install-source files in', output)
          PY
      - name: Upload install candidate
        uses: actions/upload-artifact@v4
        with:
          name: bjarkiLearn-0.1.7-shadow-install
          path: bjarkiLearn-0.1.7-shadow.zip
          if-no-files-found: error
