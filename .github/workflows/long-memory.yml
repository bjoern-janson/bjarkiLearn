name: Long-memory Lua regression
on:
  push:
    branches:
      - feat/long-memory-shadow
  pull_request:
    paths:
      - '**.lua'
      - 'tests/**'
      - '.github/workflows/long-memory.yml'
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: ['5.1', '5.4']
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua5.4
      - name: Compile addon modules
        run: |
          for file in Bootstrap.lua Rules.lua Network.lua Core.lua Adapter.lua Main.lua; do
            luac${{ matrix.runtime }} -p "$file"
          done
      - name: Long-memory regression
        run: lua${{ matrix.runtime }} tests/long_memory.lua

  package:
    name: Installable shadow ZIP
    needs: lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal addon
        run: |
          mkdir -p dist/bjarkiLearn
          cp Bootstrap.lua Rules.lua Network.lua Core.lua Adapter.lua Main.lua bjarkiLearn.toc bjarkiLearn_Camelot.toc dist/bjarkiLearn/
          (cd dist && zip -q -r ../bjarkiLearn-0.2.0-long-memory-shadow.zip bjarkiLearn)
          unzip -t bjarkiLearn-0.2.0-long-memory-shadow.zip
          sha256sum bjarkiLearn-0.2.0-long-memory-shadow.zip > SHA256SUMS
          printf 'Source commit: %s\nShadow-only: no learned consumer authority\n' "$GITHUB_SHA" > BUILD.txt
      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: bjarkiLearn-0.2.0-long-memory-shadow
          path: |
            bjarkiLearn-0.2.0-long-memory-shadow.zip
            SHA256SUMS
            BUILD.txt
          if-no-files-found: error
