name: Suite bridge integration
on:
  push:
    paths:
      - '*.lua'
      - '*.toc'
      - '*.md'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/suite-integration.yml'
  pull_request:
    paths:
      - '*.lua'
      - '*.toc'
      - '*.md'
      - 'tests/**'
      - 'docs/**'
      - '.github/workflows/suite-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read frozen dependency revisions
        id: candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('tests/suite/candidate.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for addon in manifest['addons']:
                  out.write(addon['addon'] + '=' + addon['commit'] + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: bjoern-janson/bjarkiPortraits
          ref: ${{ steps.candidate.outputs.bjarkiPortraits }}
          path: suite-deps/bjarkiPortraits
      - uses: actions/checkout@v4
        with:
          repository: bjoern-janson/bjarkiCC
          ref: ${{ steps.candidate.outputs.bjarkiCC }}
          path: suite-deps/bjarkiCC
      - uses: actions/checkout@v4
        with:
          repository: bjoern-janson/bjarkiUI
          ref: ${{ steps.candidate.outputs.bjarkiUI }}
          path: suite-deps/bjarkiUI
      - name: Verify exact candidate source
        run: >-
          python3 tests/suite/verify_candidate.py
          --portraits suite-deps/bjarkiPortraits
          --cc suite-deps/bjarkiCC
          --ui suite-deps/bjarkiUI
      - name: Install Lua runtimes
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1 lua5.4
      - name: Lua 5.1 producer-consumer contracts
        run: lua5.1 tests/suite/test_bridge.lua suite-deps/bjarkiPortraits suite-deps/bjarkiCC
      - name: Lua 5.4 producer-consumer contracts
        run: lua5.4 tests/suite/test_bridge.lua suite-deps/bjarkiPortraits suite-deps/bjarkiCC
      - name: Verify missing-identity mutation is detected
        run: |
          lua5.1 tests/suite/test_mutation.lua suite-deps/bjarkiPortraits suite-deps/bjarkiCC
          lua5.4 tests/suite/test_mutation.lua suite-deps/bjarkiPortraits suite-deps/bjarkiCC
